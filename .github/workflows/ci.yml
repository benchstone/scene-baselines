name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Costs nothing and needs no secrets, so it is the job that must always be green.
  # It catches the package defects that are invisible in the editor you built it in.
  package:
    name: Package structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every source file has a .meta
        run: |
          missing=0
          while IFS= read -r f; do
            [ -f "$f.meta" ] || { echo "::error file=$f::no .meta — Unity will generate a fresh GUID and break references to this file"; missing=1; }
          done < <(find Editor Tests -type f \( -name '*.cs' -o -name '*.asmdef' \))
          # Folders need them too; a missing folder .meta reimports as a new folder.
          while IFS= read -r d; do
            [ -f "$d.meta" ] || { echo "::error file=$d::no .meta for folder"; missing=1; }
          done < <(find Editor Tests -type d)
          exit $missing

      - name: No stray .meta without its file
        run: |
          orphan=0
          while IFS= read -r m; do
            target="${m%.meta}"
            [ -e "$target" ] || { echo "::error file=$m::.meta with nothing to describe"; orphan=1; }
          done < <(find . -name '*.meta' -not -path './.git/*')
          exit $orphan

      - name: package.json is valid, and its version matches the changelog
        run: |
          fail=0
          for field in name version displayName description unity author \
                       documentationUrl changelogUrl licensesUrl; do
            grep -q "\"$field\"" package.json || { echo "::error file=package.json::missing \"$field\""; fail=1; }
          done

          version=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)
          logged=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -1)

          if [ -z "$logged" ]; then
            echo "::error file=CHANGELOG.md::no version heading of the form '## [x.y.z]'"
            fail=1
          elif [ "$version" != "$logged" ]; then
            echo "::error::package.json says $version, CHANGELOG.md's newest entry says $logged"
            fail=1
          fi

          [ $fail -eq 0 ] && echo "package.json $version — consistent with the changelog"
          exit $fail

      - name: The package makes no network calls
        run: |
          # The pitch is that a check is deterministic and offline. This keeps that true.
          if grep -rnE 'UnityWebRequest|HttpClient|WebClient|System\.Net|Socket' Editor/; then
            echo "::error::the package must make no network calls — see the claim in README.md"
            exit 1
          fi
          echo "no network calls in Editor/"

  # Needs Unity credentials, which only the repo owner can add. Gated on them so a fork,
  # or this repo before they exist, reports a clean skip and not a red X.
  #
  # It checks the CREDENTIALS, not a licence file. Unity 6 issues an entitlement licence
  # rather than the legacy .ulf, and Unity has discontinued manual activation of Personal
  # licences, so there is no .ulf to hold any more — activation is done from the account
  # itself. See README, "Running the tests".
  licence:
    name: Unity licence available?
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            # Named individually: "one of them is missing" is the failure that cost an
            # evening, and a gate that cannot say WHICH is a gate that has to be guessed at.
            [ -n "$UNITY_EMAIL" ]    || echo "::notice::UNITY_EMAIL is not set."
            [ -n "$UNITY_PASSWORD" ] || echo "::notice::UNITY_PASSWORD is not set."
            echo "::notice::EditMode tests are skipped without both. See README, 'Running the tests'."
          fi

  # Runs the suite on a real editor, headless. Two things had to be true before this could work,
  # and both were misread as "Unity does not support Personal licences in CI":
  #
  #   1. The account must have a Unity-NATIVE password. An account created through Google sign-in has
  #      none, so every activation returns "Invalid Credential 143.002" and the licensing client wraps
  #      it as the undocumented "exit code 26: Unknown Error". The code says nothing; the line above
  #      it does. Set a password under Unity ID > Security, and keep 2FA off for this CI-only account.
  #   2. CI~/TestProject must contain an Assets folder. Unity aborts with "Couldn't set project path"
  #      before it initialises the engine if one is missing, and git cannot store an empty directory --
  #      hence the committed placeholder inside it.
  #
  # Gated on the credentials only. A fork cannot read them, so it reports a clean skip, not a red X.
  tests:
    name: EditMode tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [package, licence]
    if: needs.licence.outputs.present == 'true'
    strategy:
      # Both versions always report. If only one breaks, the other's result is the
      # information that says whether the cause is version-specific.
      fail-fast: false
      matrix:
        include:
          # The floor package.json advertises. It is here because a claimed version that
          # nothing runs is exactly the unverified claim this repo removed from its README:
          # the package did NOT compile on 2021.3 until 2026-09-02, while claiming to.
          - name: "2021.3 LTS"
            slug: "2021"
            project: "CI~/TestProject2021"
          - name: "Unity 6"
            slug: "unity6"
            project: "CI~/TestProject"
    steps:
      - uses: actions/checkout@v4

      # The repo is a package, not a project. Each matrix entry has a minimal project that
      # installs it by relative path; the trailing ~ keeps Unity from importing them when
      # somebody installs this package for real.
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.project }}/Library
          key: Library-${{ matrix.slug }}-${{ hashFiles(format('{0}/Packages/manifest.json', matrix.project)) }}
          restore-keys: Library-${{ matrix.slug }}-

      # Unity 2021.3 bundles a .NET runtime that links against libssl 1.1, and current Ubuntu
      # runners ship OpenSSL 3 only. Without this the Roslyn compiler process dies with
      # "No usable version of libssl was found / Aborted (core dumped)", and Unity then reports
      # "Scripts have compiler errors" -- which is a lie: csc never ran at all. Cost an entirely
      # wasted debugging pass once, so it is spelled out here.
      - name: libssl 1.1, which Unity 2021.3's bundled dotnet needs
        if: matrix.slug == '2021'
        run: |
          set -e
          if ! sudo apt-get install -y libssl1.1 2>/dev/null; then
            url=http://security.ubuntu.com/ubuntu/pool/main/o/openssl/
            deb=$(curl -sS "$url" | grep -o 'libssl1\.1_1\.1\.1f-1ubuntu2[^"]*_amd64\.deb' | sort -V | tail -1)
            [ -n "$deb" ] || { echo "::error::no libssl1.1 .deb found at $url"; exit 1; }
            echo "installing $deb"
            curl -fsSLO "$url$deb"
            sudo dpkg -i "$deb"
          fi
          openssl version || true

      # Installs the exact editor each project asks for, read from its ProjectVersion.txt
      # so the version can never drift from the project it is meant to test.
      #
      # The Hub version is pinned because Unity Hub 3.15.0's .deb is broken: it does not create
      # /opt/unityhub/unityhub, so a fresh Linux runner fails with ENOENT before any Unity work
      # begins. Revisit once Unity ships a fixed package.
      - uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: ${{ matrix.project }}/ProjectSettings/ProjectVersion.txt
          hub-version: '3.14.3'
          cache-installation: true

      # Activates from the ACCOUNT, not a licence file. Unity 6 issues an entitlement licence
      # rather than the legacy .ulf that game-ci actions require, and Unity has discontinued
      # manual activation of Personal licences.
      - uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Somewhere to put the results
        run: mkdir -p test-results

      # No -quit: Unity's own docs say not to combine it with -runTests, because the editor
      # can exit before the run finishes and report success for tests that never ran.
      - uses: RageAgainstThePixel/unity-action@v3
        with:
          project-path: ${{ matrix.project }}
          log-name: 'EditMode-Tests-${{ matrix.slug }}'
          args: '-batchmode -runTests -testPlatform EditMode -testResults ${{ github.workspace }}/test-results/results.xml'

      # Nineteen tests, not zero. A licence that activates but discovers nothing goes green
      # while proving nothing; this is the check that catches that.
      - name: The run must contain tests
        run: |
          f=test-results/results.xml
          [ -f "$f" ] || { echo "::error::no results.xml - the editor never reported"; exit 1; }
          total=$(grep -o 'total="[0-9]*"' "$f" | head -1 | tr -dc '0-9')
          passed=$(grep -o 'passed="[0-9]*"' "$f" | head -1 | tr -dc '0-9')
          echo "${{ matrix.name }}: total=$total passed=$passed"
          [ "${total:-0}" -ge 19 ] || { echo "::error::only ${total:-0} tests ran; expected at least 19"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.slug }}
          path: test-results
